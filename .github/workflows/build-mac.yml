name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pyobjc

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --clean --name "PersonalTodoElf" \
            --add-data "index.html:." \
            --add-data "themes.css:." \
            --add-data "themes-data.js:." \
            --add-data "app.js:." \
            --add-data "presets:presets" \
            app.py

      - name: Ad-hoc Sign App
        run: |
          codesign --force --deep --sign - "dist/PersonalTodoElf.app"

      - name: Package into ZIP
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "PersonalTodoElf.app" "PersonalTodoElf-macOS.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTodoElf-macOS
          path: dist/PersonalTodoElf-macOS.zip
